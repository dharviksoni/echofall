<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Echofall</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <section class="screen home" id="s-home">
    <div class="home-top">
      <div class="logo-tiles" id="logo-tiles" aria-hidden="true"></div>
      <h1 class="logo"><span class="l1">ECHO</span><span class="l2"><i>F</i><i>A</i><i>L</i><i class="drop">L</i></span></h1>
      <p class="tagline" data-t="tagline"></p>
    </div>
    <div class="menu">
      <button class="btn big b-bot" id="b-bot"><span class="bl" data-t="vsBot"></span><span class="bs" data-t="botSub"></span></button>
      <div class="chips" id="diff-chips" role="group">
        <button data-d="1" data-t="chill"></button>
        <button data-d="2" data-t="mid"></button>
        <button data-d="3" data-t="sweaty"></button>
      </div>
      <button class="btn big b-duo" id="b-duo"><span class="bl" data-t="passPlay"></span><span class="bs" data-t="passSub"></span></button>
      <div class="row2">
        <button class="btn" id="b-cont" data-t="cont"></button>
        <button class="btn" id="b-rules" data-t="rules"></button>
      </div>
    </div>
    <div class="toggles">
      <div class="seg" id="lang-seg" role="group" aria-label="Language">
        <button data-lang="en">EN</button>
        <button data-lang="hi">हिं</button>
      </div>
      <button class="btn tog" id="t-sound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg><span data-t="sound"></span></button>
      <button class="btn tog" id="t-hap"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M3 9v6M21 9v6"/></svg><span data-t="haptics"></span></button>
    </div>
    <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>
  </section>

  <section class="screen game" id="s-game" hidden>
    <header class="topbar">
      <button class="btn icon" id="g-home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="pill" id="g-status"></div>
      <button class="btn icon" id="g-rules" aria-label="Rule book"><svg viewBox="0 0 24 24"><path d="M9.2 9a3 3 0 1 1 4.3 2.7c-.9.5-1.5 1.2-1.5 2.3"/><path d="M12 18h.01"/></svg></button>
    </header>
    <div class="player" id="p-top"><div class="ava"></div><div class="pinfo"><span class="pname"></span><div class="caps"></div></div><span class="adv"></span></div>
    <div class="board-wrap" id="board-wrap">
      <div class="board" id="board">
        <div class="tiles" id="tiles"></div>
        <div class="pieces" id="pieces"></div>
        <div class="fx" id="fx"></div>
      </div>
    </div>
    <p class="hintline" id="g-sub"></p>
    <div class="player" id="p-bot"><div class="ava"></div><div class="pinfo"><span class="pname"></span><div class="caps"></div></div><span class="adv"></span></div>
    <div class="stats">
      <span class="stat"><span data-t="quiet"></span><b id="st-quiet">0/40</b></span>
      <span class="stat"><span data-t="fallen"></span><b id="st-fallen">0</b></span>
    </div>
    <nav class="actions">
      <button class="btn" id="a-undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><span data-t="undo"></span></button>
      <button class="btn a-hint" id="a-hint"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/></svg><span data-t="hint"></span></button>
      <button class="btn" id="a-restart"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg><span data-t="restart"></span></button>
    </nav>
  </section>

  <section class="screen rules" id="s-rules" hidden>
    <header class="topbar">
      <button class="btn icon" id="r-back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 data-t="rulesTitle"></h2>
      <span style="width:46px"></span>
    </header>
    <div class="seg" id="rl-seg" role="group" aria-label="Rule book language">
      <button data-rl="en" data-t="langEn"></button>
      <button data-rl="hi" data-t="langHi"></button>
      <button data-rl="both" data-t="langBoth"></button>
    </div>
    <div class="rule-list" id="rule-list"></div>
  </section>

  <div class="overlay" id="result" hidden>
    <canvas id="confetti"></canvas>
    <div class="card" id="result-card">
      <div id="r-ava"></div>
      <div class="stamp" id="r-title"></div>
      <p class="reason" id="r-reason"></p>
      <div class="rstats" id="r-stats"></div>
      <div class="rbtns">
        <button class="btn" id="r-home" data-t="home"></button>
        <button class="btn primary" id="r-rematch" data-t="rematch"></button>
      </div>
    </div>
  </div>

  <div class="overlay sheet" id="confirm" hidden>
    <div class="card">
      <h3 data-t="restartQ"></h3>
      <div class="rbtns">
        <button class="btn" id="c-no" data-t="cancel"></button>
        <button class="btn primary" id="c-yes" data-t="restartYes"></button>
      </div>
    </div>
  </div>
</div>
<script src="engine.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
